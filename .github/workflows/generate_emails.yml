name: Generate Email Notifications

on:
  workflow_dispatch:

jobs:
  trigger-emails:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create 38 Releases to force email notifications
        run: |
          for i in $(seq 1 38); do
            TIMESTAMP=$(date +%s%N)
            gh release create "v1.0.$i-$TIMESTAMP" --title "Thông báo mới #$i" --notes "Nội dung kiểm tra thông báo email."
            sleep 1
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
